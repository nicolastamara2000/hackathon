[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "matchcopilot"
version = "0.1.0"
description = "Synthetic football match events turned into explainable, personalized match intelligence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "agent-framework-core>=1.23",
    "agent-framework-foundry>=1.15",
    "azure-identity>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
matchgen = "matchcopilot.generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matchcopilot = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
